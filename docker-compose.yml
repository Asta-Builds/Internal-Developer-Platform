services:
  # 1. PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: idp-postgres
    environment:
      POSTGRES_DB: idpdb
      POSTGRES_USER: idpuser
      POSTGRES_PASSWORD: idppassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idpuser -d idpdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 High-Performance Distributed Caching Tier
  redis:
    image: redis:7-alpine
    container_name: idp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. RabbitMQ 3.13 Message Broker with Management Web Console
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: idp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP Protocol
      - "15672:15672"  # Management Web UI (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  # 4. Keycloak IAM Service (OAuth2 / OIDC Authorization Server)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: idp-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: adminpassword
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/idpdb
      KC_DB_USERNAME: idpuser
      KC_DB_PASSWORD: idppassword
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/idp-realm.json:/opt/keycloak/data/import/idp-realm.json:ro
      - ./keycloak/theme:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy

  # 5. FastAPI AI Microservice Consumer (Consumes from RabbitMQ)
  idp-ai-consumer:
    build:
      context: ./ai-consumer
      dockerfile: Dockerfile
    container_name: idp-ai-consumer
    ports:
      - "8008:8000"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      INCOMING_QUEUE: fraud.analysis.queue
      OUTGOING_QUEUE: fraud.result.queue
      EXCHANGE_NAME: idp.direct.exchange
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 6. Spring Boot 3.2 Core API Backend (Producer & Orchestrator)
  idp-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: idp-backend
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/idpdb
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: idpuser
      SPRING_DATASOURCE_PASSWORD: idppassword
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      # Tokens are issued to a browser talking to localhost:8180, so that is the
      # issuer the backend must validate. Keys, however, are fetched over the Docker
      # network where Keycloak answers to "keycloak" — hence the two separate URIs.
      IDP_SECURITY_ISSUER_URI: http://localhost:8180/realms/idp-realm
      IDP_SECURITY_JWK_SET_URI: http://keycloak:8180/realms/idp-realm/protocol/openid-connect/certs
      # Seeded realm personas (tech_lead/developer/viewer) have no internal user row
      # until an ADMIN creates one; allow first-login provisioning in this dev stack.
      IDP_SECURITY_AUTO_PROVISION: "true"
      IDP_SECURITY_CORS_ORIGINS: http://localhost:4200,http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 7. Angular 17 Standalone Web Portal UI
  idp-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: idp-frontend
    ports:
      - "4200:80"
    depends_on:
      - idp-backend

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
