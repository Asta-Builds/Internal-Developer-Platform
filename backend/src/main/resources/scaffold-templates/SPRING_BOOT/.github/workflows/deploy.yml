name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Lint and test in one gate; Checkstyle runs during verify.
      - name: Lint and test
        run: mvn -B --no-transfer-progress verify

  image:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ghcr.io/{{repoName}}:${{ github.sha }} .
      - name: Log in to registry
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: docker push ghcr.io/{{repoName}}:${{ github.sha }}