name: CI

# The platform enforces its own authorization, so a regression here fails *open*
# rather than loudly. These checks run on every push and pull request to the
# integration branches.
on:
  push:
    branches: [main, pre-prod, dev]
  pull_request:
    branches: [main, pre-prod, dev]
  workflow_dispatch:

# A newer commit on the same ref makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorization-guard:
    name: Authorization coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Runs in seconds and fails fast: an endpoint without @PreAuthorize is
      # reachable by any authenticated user regardless of role.
      - name: Every endpoint must be authorized or explicitly public
        run: python .github/scripts/check_endpoint_authorization.py

  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # verify rather than test: also packages the jar, so a break that would
      # only surface during the Docker image build is caught here.
      - name: Build and test
        run: mvn -B --no-transfer-progress verify
        working-directory: backend

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: frontend

      # tsc does not compile Angular templates; only a real build does, and most
      # of the admin console is template code.
      - name: Build (compiles templates)
        run: npm run build
        working-directory: frontend

      - name: Unit tests (Jest)
        run: npm test
        working-directory: frontend

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jest-reports
          path: frontend/test-results/
          retention-days: 7

  ai-consumer:
    name: AI consumer (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
        working-directory: ai-consumer

      - name: Unit tests (pytest)
        run: pytest
        working-directory: ai-consumer
