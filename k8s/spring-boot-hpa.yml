apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-backend
  namespace: idp-system
  labels:
    app: idp-backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: idp-backend
  template:
    metadata:
      labels:
        app: idp-backend
    spec:
      containers:
        - name: idp-backend
          image: idp-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/idpdb"
            - name: SPRING_REDIS_HOST
              value: "redis-service"
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq-service"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8088
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8088
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: idp-backend-service
  namespace: idp-system
spec:
  type: ClusterIP
  selector:
    app: idp-backend
  ports:
    - port: 8088
      targetPort: 8088
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: idp-backend-hpa
  namespace: idp-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: idp-backend
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
