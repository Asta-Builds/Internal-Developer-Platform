apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idp-ingress
  namespace: idp-system
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Distributed Rate Limiting: 1,000 requests per minute per IP
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    # Cross-Origin Resource Sharing (CORS)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Correlation-ID"
spec:
  rules:
    - host: idp.company.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: idp-backend-service
                port:
                  number: 8088
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: idp-ai-consumer-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: idp-frontend-service
                port:
                  number: 4200
